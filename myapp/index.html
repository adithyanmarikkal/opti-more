<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiMore.ai - Resume Analyser</title>
    
    <!-- Google Fonts: EB Garamond & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Eb+Garamond:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <!-- Tailwind CSS with Sahara Theme Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#faf5ee",
              surface: "#faf5ee",
              "surface-container": "#f2ece4",
              "surface-container-low": "#f6f0e8",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#ece6dc",
              "surface-container-highest": "#e6e0d6",
              "surface-dim": "#dcd6cc",
              "surface-bright": "#faf5ee",
              primary: "#c2652a",
              "primary-container": "#e08850",
              "on-primary": "#ffffff",
              "on-primary-container": "#fbe8d8",
              secondary: "#78706a",
              "secondary-container": "#eae2da",
              "on-surface": "#3a302a",
              "on-surface-variant": "#605850",
              "on-background": "#3a302a",
              tertiary: "#8c3c3c",
              "tertiary-container": "#d47070",
              outline: "#9a9088",
              "outline-variant": "#d8d0c8",
              error: "#c0392b",
            },
            fontFamily: {
              headline: ["'Eb Garamond'", "serif"],
              display: ["'Eb Garamond'", "serif"],
              body: ["'Manrope'", "sans-serif"],
              label: ["'Manrope'", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-background font-body text-on-background antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
